# --- detector ---
# type: "motion" (MOG2, weight-free, static camera only)
#       "yolo"   (DNN, needs weights/xxx.onnx via scripts/download_model.py)
detector:
  type: "motion"
  min_area: 500        # motion only: ignore blobs smaller than this (px^2)
  history: 500         # motion only: MOG2 background history (frames)
  var_threshold: 16    # motion only: MOG2 sensitivity; lower = more sensitive
  # --- yolo options ---
  weights: "weights/yolo11n.onnx"
  conf_thresh: 0.5     # yolo only: minimum class score
  nms_thresh: 0.45     # yolo only: NMS IoU threshold
  input_size: 640      # yolo only: model input resolution
  classes: []          # yolo only: e.g. ["person", "car"]; empty = all 80 COCO

# --- tracker (ByteTrack-style) ---
tracker:
  high_thresh: 0.5     # stage-1 association threshold
  low_thresh: 0.15     # stage-2 rescue threshold
  max_iou_dist: 0.7    # reject matches with cost above this (1 - IoU)
  n_init: 3            # hits before Tentative -> Confirmed
  max_age: 30          # frames before a Tentative track is deleted
  max_lost: 60         # frames before a Lost track is deleted

# --- zones & tripwires (pixel coords, tune to your camera) ---
zones:
  - name: "door"
    polygon: [[40, 200], [280, 200], [280, 440], [40, 440]]

tripwires:
  - name: "gate"
    p1: [160, 60]
    p2: [160, 420]

# --- behavioral events ---
events:
  loitering: { enabled: true, radius_px: 40, min_frames: 150 }
  speeding:  { enabled: true, max_px_per_sec: 300 }
  wrong_way: { enabled: true, flow: [1, 0] }   # expected: moving right
  crowding:  { enabled: false, max_tracks: 5 }
